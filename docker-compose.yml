version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-docker-demo-key
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - ENCRYPTION_KEY=BkETuXXdJwHaos+r1K2aWhU+pNyG0JEDlh+LiZOmIZU=
      - MAX_UPLOAD_SIZE_MB=25
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - encrypted_media:/app/backend/media/encrypted_files
      - db_data:/app/backend

  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://backend:8000

volumes:
  encrypted_media:
  db_data:
